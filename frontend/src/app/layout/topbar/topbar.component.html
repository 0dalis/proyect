<header class="glass glass-bar flex items-center gap-3 px-4 py-2.5">
  <button
    type="button"
    class="btn btn-sm btn-ghost lg:hidden"
    (click)="layout.toggleSidebar()"
    aria-label="Abrir menú"
  >
    <i class="bi bi-list text-lg" aria-hidden="true"></i>
  </button>

  <nav class="truncate text-sm text-muted-text" aria-label="Ubicación">
    <a routerLink="/panel" class="text-muted-text no-underline hover:text-ink">{{
      auth.user()?.company?.name
    }}</a>
    <span class="mx-1.5 text-muted">/</span>
    <span class="font-semibold text-ink">{{ layout.pageTitle() }}</span>
  </nav>

  <span class="flex-1"></span>

  <app-theme-toggle />

  <app-notification-bell />

  <div class="relative">
    <button
      type="button"
      class="flex cursor-pointer items-center gap-2 rounded-xl py-1 pr-2 pl-1 transition hover:bg-surface/70"
      (click)="menuOpen.set(!menuOpen())"
    >
      @if (auth.user()?.avatar_url; as avatar) {
        <img [src]="avatar" alt="" class="size-8 shrink-0 rounded-full object-cover" />
      } @else {
        <span class="grid size-8 place-items-center rounded-full bg-primary text-xs font-bold text-white"
          >{{ initials() }}</span
        >
      }
      <span class="hidden text-left sm:block">
        <span class="block text-sm leading-tight font-semibold text-ink">{{
          auth.user()?.name
        }}</span>
        <span class="block text-xs leading-tight text-muted-text">{{
          auth.user()?.role_label
        }}</span>
      </span>
      <i class="bi bi-chevron-down text-xs text-muted" aria-hidden="true"></i>
    </button>

    @if (menuOpen()) {
      <div class="glass absolute right-0 mt-2 w-56 bg-surface/85 p-1.5">
        <div class="border-b border-glass px-3 py-2 text-xs text-muted-text">
          {{ auth.user()?.email }}
        </div>
        <a
          routerLink="/panel/perfil"
          (click)="menuOpen.set(false)"
          class="block rounded-lg px-3 py-2 text-sm text-ink-soft no-underline hover:bg-surface"
          >Mi perfil</a
        >
        @if (auth.isOwner()) {
          <a
            routerLink="/panel/configuracion"
            (click)="menuOpen.set(false)"
            class="block rounded-lg px-3 py-2 text-sm text-ink-soft no-underline hover:bg-surface"
            >Configuración</a
          >
        }
        @if (auth.user()?.can_rate) {
          <button
            type="button"
            class="flex w-full cursor-pointer items-center gap-2 rounded-lg px-3 py-2 text-left text-sm text-ink-soft hover:bg-surface"
            (click)="rate()"
          >
            <i class="bi bi-star text-warning" aria-hidden="true"></i> Calificar AsistControl
          </button>
        }
        <button
          type="button"
          class="block w-full cursor-pointer rounded-lg px-3 py-2 text-left text-sm text-danger-text hover:bg-surface"
          (click)="logout()"
        >
          Cerrar sesión
        </button>
      </div>
    }
  </div>
</header>
