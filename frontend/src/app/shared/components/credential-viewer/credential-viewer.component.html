<app-modal heading="Credencial" size="lg" (closed)="closed.emit()">
  <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
    <div class="flex gap-2" role="group" aria-label="Orientación de la credencial">
      <button
        type="button"
        class="btn btn-sm"
        [class.btn-primary]="orientation() === 'horizontal'"
        [attr.aria-pressed]="orientation() === 'horizontal'"
        (click)="setOrientation('horizontal')"
      >
        <i class="bi bi-arrows-horizontal" aria-hidden="true"></i> Horizontal
      </button>
      <button
        type="button"
        class="btn btn-sm"
        [class.btn-primary]="orientation() === 'vertical'"
        [attr.aria-pressed]="orientation() === 'vertical'"
        (click)="setOrientation('vertical')"
      >
        <i class="bi bi-arrows-vertical" aria-hidden="true"></i> Vertical
      </button>
    </div>

    <p class="!mb-0 text-sm text-muted-text">
      {{ employee().first_name }} {{ employee().last_name }} · {{ employee().employee_code }}
    </p>
  </div>

  <div class="cred-preview">
    <div #frontCard class="frame">
      <app-credential-card
        [employee]="employee()"
        [company]="company()"
        [orientation]="orientation()"
        face="front"
      />
    </div>
    <div #backCard class="frame">
      <app-credential-card
        [employee]="employee()"
        [company]="company()"
        [orientation]="orientation()"
        face="back"
      />
    </div>
  </div>

  <div modal-footer>
    <button type="button" class="btn" [disabled]="busy()" (click)="print()">
      <i class="bi bi-printer" aria-hidden="true"></i> Imprimir
    </button>
    <button type="button" class="btn btn-primary" [disabled]="busy()" (click)="download()">
      <i class="bi bi-download" aria-hidden="true"></i> Descargar
    </button>
  </div>
</app-modal>
