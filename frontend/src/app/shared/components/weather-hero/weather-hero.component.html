<section class="hero" [attr.data-kind]="kind()" role="region" aria-label="Encabezado con clima actual">
  <!-- Fondo según el clima: video en bucle (estilo app Clima de iOS) sobre su
       imagen fija, que se ve mientras carga y con "reducir movimiento". -->
  @if (weather(); as w) {
    <img class="hero-bg" [src]="w.background" alt="" aria-hidden="true" />
    <video
      class="hero-bg hero-video"
      [class.ready]="videoReady()"
      [src]="w.video"
      [poster]="w.background"
      [muted]="true"
      autoplay
      muted
      loop
      playsinline
      disablepictureinpicture
      preload="auto"
      aria-hidden="true"
      tabindex="-1"
      (canplay)="videoReady.set(true)"
    ></video>
  }
  <!-- Velo para que el texto siempre sea legible sobre la imagen. -->
  <div class="scrim" aria-hidden="true"></div>

  <div class="hero-content">
    <div class="hero-text">
      <h1>{{ heading() }}</h1>
      @if (description()) {
        <p class="hero-desc">{{ description() }}</p>
      }
      <p class="hero-weather">
        @if (loading()) {
          <span class="w-skeleton" aria-label="Cargando clima"></span>
        } @else if (weather(); as w) {
          <i class="bi {{ icon() }}" aria-hidden="true"></i>
          @if (hasTemp(w)) {
            <strong>{{ w.temperature }}°</strong>
          }
          <span>{{ w.label }} en {{ w.place }}</span>
          @if (notice()) {
            <button type="button" class="w-retry" (click)="retry()" title="Usar mi ubicación">
              · usar mi ubicación
            </button>
          }
        } @else {
          <button type="button" class="w-retry" (click)="retry()">
            <i class="bi bi-arrow-clockwise" aria-hidden="true"></i> Reintentar clima
          </button>
        }
      </p>
    </div>
    <div class="hero-actions">
      <ng-content />
    </div>
  </div>
</section>
