<div class="flex items-center gap-4">
  @if (!compact()) {
    <div class="relative shrink-0">
      @if (url(); as src) {
        <img [src]="src" [alt]="label()" class="photo" />
      } @else {
        <span class="photo photo--empty">{{ initials() || '·' }}</span>
      }
      @if (busy()) {
        <span class="photo-busy"><i class="bi bi-arrow-repeat animate-spin" aria-hidden="true"></i></span>
      }
    </div>
  }

  <div class="flex min-w-0 flex-col items-start gap-1.5">
    @if (!compact()) {
      <span class="text-sm font-semibold text-ink">{{ label() }}</span>
    }
    <div class="flex flex-wrap items-center gap-2">
      <label class="btn btn-sm cursor-pointer">
        <i class="bi bi-camera" aria-hidden="true"></i>
        {{ photoUrl() ? 'Cambiar foto' : 'Subir foto' }}
        <input
          type="file"
          class="sr-only"
          accept="image/jpeg,image/png,image/webp"
          [disabled]="busy()"
          (change)="pick($event)"
        />
      </label>
      @if (photoUrl() && canRemove()) {
        <button
          type="button"
          class="btn btn-sm btn-ghost text-danger-text"
          [disabled]="busy()"
          (click)="remove()"
        >
          <i class="bi bi-trash3" aria-hidden="true"></i> Quitar
        </button>
      }
      @if (busy()) {
        <span class="text-xs text-muted-text">Subiendo…</span>
      }
    </div>
    <span class="text-xs text-muted-text">{{ hint() }}</span>
  </div>
</div>
