<div class="fixed top-4 right-4"><app-theme-toggle /></div>

<div class="card w-full max-w-md !p-8">
  <a routerLink="/" class="mb-6 flex items-center gap-2 text-lg font-bold text-ink no-underline">
    <span
      class="grid size-9 place-items-center rounded-xl bg-ink text-white shadow-md shadow-black/25 dark:bg-primary"
    >
      <i class="bi bi-fingerprint" aria-hidden="true"></i>
    </span>
    AsistControl
  </a>
  <h1 class="text-2xl">Inicia sesión</h1>
  <p class="mb-6 text-sm text-muted-text">Panel de administración de tu empresa.</p>

  <!-- Única alerta fija: requiere una acción del usuario -->
  @if (unverified()) {
    <div class="alert alert-info flex-col">
      <span
        ><i class="bi bi-envelope-exclamation" aria-hidden="true"></i> Aún no confirmas tu
        correo.</span
      >
      <button class="btn btn-sm" type="button" (click)="resend()" [disabled]="resent()">
        {{ resent() ? 'Enlace enviado' : 'Reenviar enlace de confirmación' }}
      </button>
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
      <label for="email">Correo</label>
      <input id="email" type="email" formControlName="email" autocomplete="email" />
    </div>
    <div class="field">
      <div class="flex items-center">
        <label for="password" class="flex-1">Contraseña</label>
        <a routerLink="/olvide-contrasena" class="text-xs font-medium">¿La olvidaste?</a>
      </div>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
      />
    </div>
    <button
      class="btn btn-primary btn-lg w-full"
      type="submit"
      [disabled]="form.invalid || loading()"
    >
      @if (loading()) {
        <i class="bi bi-arrow-repeat animate-spin" aria-hidden="true"></i> Entrando…
      } @else {
        <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> Entrar
      }
    </button>
  </form>
  <p class="mt-5 text-center text-sm text-ink-soft">
    ¿Tu empresa aún no usa AsistControl? <a routerLink="/registro">Regístrala</a>
  </p>
  <app-recaptcha-notice />
  <p class="mt-4 text-center text-xs text-muted-text">
    <a routerLink="/legal/terminos" class="text-muted-text">Términos</a> ·
    <a routerLink="/legal/privacidad" class="text-muted-text">Privacidad</a> ·
    <a routerLink="/legal/cookies" class="text-muted-text">Cookies</a>
  </p>
</div>
