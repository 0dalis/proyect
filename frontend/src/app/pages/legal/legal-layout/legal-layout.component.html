<header class="sticky top-0 z-30 px-4 pt-3">
  <div class="glass mx-auto flex h-16 max-w-4xl items-center gap-4 px-5">
    <a routerLink="/" class="flex items-center gap-2 text-lg font-bold text-ink no-underline">
      <span class="grid size-9 place-items-center rounded-xl bg-ink text-white dark:bg-primary">
        <i class="bi bi-fingerprint" aria-hidden="true"></i>
      </span>
      {{ legal.product }}
    </a>
    <span class="flex-1"></span>
    <app-theme-toggle />
    <a routerLink="/login" class="btn btn-ghost btn-sm">Entrar</a>
  </div>
</header>

<div class="mx-auto max-w-4xl px-4 py-8">
  <nav class="mb-6 flex flex-wrap gap-2" aria-label="Documentos legales">
    @for (link of links; track link.path) {
      <a
        [routerLink]="link.path"
        routerLinkActive="!border-primary !bg-primary-soft !text-primary-active"
        class="btn btn-sm"
      >
        {{ link.label }}
      </a>
    }
  </nav>

  <article class="card legal !p-8">
    <router-outlet />
  </article>

  <p class="mt-6 text-center text-xs text-muted-text">
    © {{ year }} {{ legal.provider }} · {{ legal.product }} · Versión {{ legal.version }}
  </p>
</div>
