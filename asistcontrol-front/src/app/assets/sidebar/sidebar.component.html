<aside class="flex flex-col w-64 h-screen px-5 py-8 overflow-y-auto bg-surface border-r border-gray-200 dark:border-gray-700">
    <div class="flex items-center gap-x-3">
        <!-- Logo o Nombre de la App -->
        <span class="text-2xl font-bold text-primary-medium">AdminPanel</span>
    </div>

    <div class="flex flex-col justify-between flex-1 mt-6">
        <nav class="flex-1 -mx-3 space-y-3 ">
            <div *ngFor="let item of menuItems">
                <a [routerLink]="item.route"
                   routerLinkActive="bg-primary-light/10 text-primary-medium"
                   class="flex items-center px-3 py-2 text-text-body transition-colors duration-300 transform rounded-lg hover:bg-primary-light/10 hover:text-primary-medium">
                    <span class="mx-2 text-sm font-medium">{{ item.label }}</span>
                </a>
            </div>
        </nav>

        <div class="mt-6">
            <button (click)="onLogout()"
                class="flex items-center w-full px-3 py-2 text-text-body transition-colors duration-300 transform rounded-lg hover:bg-red-100 hover:text-red-600">
                <span class="mx-2 text-sm font-medium">Cerrar Sesión</span>
            </button>
        </div>
    </div>
</aside>
