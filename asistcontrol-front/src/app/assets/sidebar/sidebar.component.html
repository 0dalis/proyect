<aside [class.translate-x-0]="isOpen"
       class="fixed inset-y-0 left-0 z-50 w-64 bg-surface border-r border-gray-200 dark:border-gray-700 transition-transform duration-300 ease-in-out transform -translate-x-full lg:relative lg:translate-x-0 flex flex-col h-full overflow-hidden">

    <div class="flex items-center gap-x-3 px-6 py-6">
        <span class="text-xl font-bold text-primary-medium tracking-tight">AdminPanel</span>
    </div>

    <div class="flex flex-col justify-between flex-1 overflow-y-auto px-3 py-4">
        <nav class="space-y-1">

            <!-- 1. DASHBOARD (Simple Link) -->
            <div class="group">
                <a routerLink="/welcome/dashboard"
                   routerLinkActive="bg-primary-light/10 text-primary-medium"
                   class="flex items-center px-3 py-2 text-xs font-medium text-text-body transition-all duration-200 rounded-lg hover:bg-primary-light/10 hover:text-primary-medium">
                    <span class="mx-2">Dashboard</span>
                </a>
            </div>

            <!-- 2. GESTIÓN (Card Stack Submenu) -->
            <div class="group">
                <button (click)="gestionExpanded = !gestionExpanded"
                        class="w-full flex items-center justify-between px-3 py-2 text-xs font-medium text-text-body transition-all duration-200 rounded-lg hover:bg-primary-light/10 hover:text-primary-medium">
                    <span class="mx-2">Gestión</span>
                    <svg xmlns="http://www.w3.org/2000/svg"
                         class="h-3 w-3 transition-transform duration-200"
                         [class.rotate-180]="gestionExpanded"
                         fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </button>

                <div [class.submenu-abierto]="gestionExpanded"
                     style="--total: 3;"
                     class="submenu-contenedor mt-1 ml-4 flex flex-col">

                    <a routerLink="/welcome/users"
                       routerLinkActive="bg-primary-light/10 text-primary-medium"
                       style="--i: 0;"
                       class="carta-submenu flex items-center px-3 py-2 text-xs font-medium text-text-body transition-all rounded-lg hover:bg-primary-light/10 hover:text-primary-medium">
                        <span class="mx-2">Usuarios</span>
                    </a>

                    <a routerLink="/welcome/roles"
                       routerLinkActive="bg-primary-light/10 text-primary-medium"
                       style="--i: 1;"
                       class="carta-submenu flex items-center px-3 py-2 text-xs font-medium text-text-body transition-all rounded-lg hover:bg-primary-light/10 hover:text-primary-medium">
                        <span class="mx-2">Roles</span>
                    </a>

                    <a routerLink="/welcome/permissions"
                       routerLinkActive="bg-primary-light/10 text-primary-medium"
                       style="--i: 2;"
                       class="carta-submenu flex items-center px-3 py-2 text-xs font-medium text-text-body transition-all rounded-lg hover:bg-primary-light/10 hover:text-primary-medium">
                        <span class="mx-2">Permisos</span>
                    </a>
                </div>
            </div>

            <!-- 3. CONFIGURACIÓN (Card Stack Submenu) -->
            <div class="group">
                <button (click)="configExpanded = !configExpanded"
                        class="w-full flex items-center justify-between px-3 py-2 text-xs font-medium text-text-body transition-all duration-200 rounded-lg hover:bg-primary-light/10 hover:text-primary-medium">
                    <span class="mx-2">Configuración</span>
                    <svg xmlns="http://www.w3.org/2000/svg"
                         class="h-3 w-3 transition-transform duration-200"
                         [class.rotate-180]="configExpanded"
                         fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </button>

                <div [class.submenu-abierto]="configExpanded"
                     style="--total: 2;"
                     class="submenu-contenedor mt-1 ml-4 flex flex-col">

                    <a routerLink="/welcome/settings/general"
                       routerLinkActive="bg-primary-light/10 text-primary-medium"
                       style="--i: 0;"
                       class="carta-submenu flex items-center px-3 py-2 text-xs font-medium text-text-body transition-all rounded-lg hover:bg-primary-light/10 hover:text-primary-medium">
                        <span class="mx-2">General</span>
                    </a>

                    <a routerLink="/welcome/settings/appearance"
                       routerLinkActive="bg-primary-light/10 text-primary-medium"
                       style="--i: 1;"
                       class="carta-submenu flex items-center px-3 py-2 text-xs font-medium text-text-body transition-all rounded-lg hover:bg-primary-light/10 hover:text-primary-medium">
                        <span class="mx-2">Apariencia</span>
                    </a>
                </div>
            </div>
        </nav>

        <div class="mt-auto pt-4 border-t border-gray-200 dark:border-gray-700">
            <button (click)="onLogout()"
                class="flex items-center w-full px-3 py-2 text-xs font-medium text-text-body transition-all duration-200 rounded-lg hover:bg-red-100 hover:text-red-600 dark:hover:bg-red-900/20">
                <span class="mx-2">Cerrar Sesión</span>
            </button>
        </div>
    </div>
</aside>
