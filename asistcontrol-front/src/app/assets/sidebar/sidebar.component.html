<div class="flex h-screen w-screen overflow-hidden">

  <aside
    (mouseenter)="onSidebarMouseEnter()"
    (mouseleave)="onSidebarMouseLeave()"
    [class.translate-x-0]="isOpen"
    [class.w-52]="isSidebarHovered" [class.w-16]="!isSidebarHovered"
    class="fixed inset-y-0 left-0 z-50 bg-surface transition-all duration-300 ease-in-out transform -translate-x-full lg:relative lg:translate-x-0 flex flex-col h-full overflow-hidden">

    <div class="flex items-center gap-x-3 px-4 py-6 overflow-hidden min-h-[76px]">
        <i class="bi bi-shield-lock-fill text-xl text-primary-medium min-w-[24px] text-center"></i>
        <span [class.opacity-0]="!isSidebarHovered"
              [class.pointer-events-none]="!isSidebarHovered"
              class="text-lg font-bold text-primary-medium tracking-tight transition-all duration-300 whitespace-nowrap">
            AdminPanel
        </span>
    </div>

    <div class="flex flex-col justify-between flex-1 overflow-y-auto overflow-x-hidden px-3 py-4">
        <nav class="space-y-1">
            <div class="group">
                <a routerLink="/asistcontrol/dashboard"
                   routerLinkActive="bg-primary-light/10 text-primary-medium"
                   class="flex items-center px-3 py-2 text-xs font-medium text-text-body transition-all duration-200 rounded-lg hover:bg-primary-light/10 hover:text-primary-medium">
                    <i class="bi bi-house-door text-base min-w-[24px] text-center"></i>
                    <span [class.opacity-0]="!isSidebarHovered" class="mx-2 transition-all duration-300 whitespace-nowrap">Inicio</span>
                </a>
            </div>

            <div class="group">
                <button (click)="isSidebarHovered ? gestionExpanded = !gestionExpanded : onSidebarMouseEnter()"
                        class="w-full flex items-center justify-between px-3 py-2 text-xs font-medium text-text-body transition-all duration-200 rounded-lg hover:bg-primary-light/10 hover:text-primary-medium">
                    <div class="flex items-center">
                        <i class="bi bi-gear text-base min-w-[24px] text-center"></i>
                        <span [class.opacity-0]="!isSidebarHovered" class="mx-2 transition-all duration-300 whitespace-nowrap">Gestión</span>
                    </div>
                    <svg *ngIf="isSidebarHovered" xmlns="http://www.w3.org/2000/svg"
                         class="h-3 w-3 transition-transform duration-200"
                         [class.rotate-180]="gestionExpanded"
                         fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </button>

                <div [class.submenu-abierto]="gestionExpanded && isSidebarHovered"
                     style="--total: 4;"
                     class="submenu-contenedor mt-1 ml-4 flex flex-col">
                    <a routerLink="/welcome/users" style="--i: 0;" class="carta-submenu flex items-center px-3 py-2 text-xs font-medium text-text-body transition-all rounded-lg hover:bg-primary-light/10 hover:text-primary-medium">
                        <i class="bi bi-people text-sm min-w-[20px] text-center"></i>
                        <span [class.opacity-0]="!isSidebarHovered" class="mx-2 whitespace-nowrap">Empleados</span>
                    </a>
                    <a routerLink="/welcome/roles" style="--i: 1;" class="carta-submenu flex items-center px-3 py-2 text-xs font-medium text-text-body transition-all rounded-lg hover:bg-primary-light/10 hover:text-primary-medium">
                        <i class="bi bi-geo text-sm min-w-[20px] text-center"></i>
                        <span [class.opacity-0]="!isSidebarHovered" class="mx-2 whitespace-nowrap">Áreas</span>
                    </a>
                    <a routerLink="/welcome/permissions" style="--i: 2;" class="carta-submenu flex items-center px-3 py-2 text-xs font-medium text-text-body transition-all rounded-lg hover:bg-primary-light/10 hover:text-primary-medium">
                        <i class="bi bi-person-badge text-sm min-w-[20px] text-center"></i>
                        <span [class.opacity-0]="!isSidebarHovered" class="mx-2 whitespace-nowrap">Gerentes</span>
                    </a>
                    <a routerLink="/asistcontrol/shifts" style="--i: 3;" class="carta-submenu flex items-center px-3 py-2 text-xs font-medium text-text-body transition-all rounded-lg hover:bg-primary-light/10 hover:text-primary-medium">
                        <i class="bi bi-calendar-clock text-sm min-w-[20px] text-center"></i>
                        <span [class.opacity-0]="!isSidebarHovered" class="mx-2 whitespace-nowrap">Horarios</span>
                    </a>
                </div>
            </div>

            <div class="group">
                <button (click)="isSidebarHovered ? configExpanded = !configExpanded : onSidebarMouseEnter()"
                        class="w-full flex items-center justify-between px-3 py-2 text-xs font-medium text-text-body transition-all duration-200 rounded-lg hover:bg-primary-light/10 hover:text-primary-medium">
                    <div class="flex items-center">
                        <i class="bi bi-sliders text-base min-w-[24px] text-center"></i>
                        <span [class.opacity-0]="!isSidebarHovered" class="mx-2 transition-all duration-300 whitespace-nowrap">Configuración</span>
                    </div>
                    <svg *ngIf="isSidebarHovered" xmlns="http://www.w3.org/2000/svg"
                         class="h-3 w-3 transition-transform duration-200"
                         [class.rotate-180]="configExpanded"
                         fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </button>

                <div [class.submenu-abierto]="configExpanded && isSidebarHovered"
                     style="--total: 2;"
                     class="submenu-contenedor mt-1 ml-4 flex flex-col">
                    <a routerLink="/welcome/settings/general" style="--i: 0;" class="carta-submenu flex items-center px-3 py-2 text-xs font-medium text-text-body transition-all rounded-lg hover:bg-primary-light/10 hover:text-primary-medium">
                        <i class="bi bi-sliders2 text-sm min-w-[20px] text-center"></i>
                        <span [class.opacity-0]="!isSidebarHovered" class="mx-2 whitespace-nowrap">General</span>
                    </a>
                    <a routerLink="/welcome/settings/appearance" style="--i: 1;" class="carta-submenu flex items-center px-3 py-2 text-xs font-medium text-text-body transition-all rounded-lg hover:bg-primary-light/10 hover:text-primary-medium">
                        <i class="bi bi-palette text-sm min-w-[20px] text-center"></i>
                        <span [class.opacity-0]="!isSidebarHovered" class="mx-2 whitespace-nowrap">Apariencia</span>
                    </a>
                </div>
            </div>
        </nav>

        <div class="mt-auto pt-4">
            <button (click)="onLogout()"
                class="flex items-center w-full px-3 py-2 text-xs font-medium text-text-body transition-all duration-200 rounded-lg hover:bg-red-100 hover:text-red-600 dark:hover:bg-red-900/20">
                <i class="bi bi-box-arrow-left text-base min-w-[24px] text-center"></i>
                <span [class.opacity-0]="!isSidebarHovered" class="mx-2 transition-all duration-300 whitespace-nowrap">Cerrar Sesión</span>
            </button>
        </div>
    </div>
  </aside>

  <div class="flex flex-col flex-1 h-full min-w-0 overflow-hidden transition-all duration-300 ease-in-out">
    <div class="flex items-center justify-between h-[76px] min-h-[76px] px-6">
      <div></div>
      <div class="flex items-center gap-x-6">
        <span class="px-3 py-1 text-xs font-semibold text-primary-medium bg-primary-light/10 rounded-full tracking-wide">Plan Free</span>
        <div class="relative">

          <button (click)="userMenuOpen = !userMenuOpen" class="flex items-center gap-x-2 text-xs font-medium text-text-body hover:text-primary-medium transition-all duration-200 rounded-lg hover:bg-primary-light/10 px-3 py-2 focus:outline-none">
            <i class="bi bi-person-circle text-base text-primary-medium"></i>
            <span class="hidden sm:inline">Usuario</span>
            <i class="bi bi-chevron-down text-[10px] transition-transform duration-200" [class.rotate-180]="userMenuOpen"></i>
          </button>

          <div
            *ngIf="userMenuOpen"
            (mouseleave)="userMenuOpen = false"
            class="absolute right-0 mt-2 w-48 bg-surface border border-gray-200 dark:border-gray-700 rounded-xl shadow-lg py-1 z-50">

            <a routerLink="/welcome/profile" class="flex items-center gap-x-2 px-3 py-2 text-xs font-medium text-text-body transition-all duration-200 rounded-lg hover:bg-primary-light/10 hover:text-primary-medium">
              <i class="bi bi-person text-base"></i>
              Ver Perfil
            </a>

            <a routerLink="/welcome/settings/security" class="flex items-center gap-x-2 px-3 py-2 text-xs font-medium text-text-body transition-all duration-200 rounded-lg hover:bg-primary-light/10 hover:text-primary-medium">
              <i class="bi bi-key text-base"></i>
              Cambiar Contraseña
            </a>
          </div>
        </div>
      </div>
    </div>
    <main class="flex-1 overflow-y-auto p-6">
      <ng-content></ng-content>
    </main>
  </div>
</div>
