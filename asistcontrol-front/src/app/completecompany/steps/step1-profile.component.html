<div class="step-container">
  <div class="step-header">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-10 h-10 bg-orange-100 rounded-lg flex items-center justify-center">
        <i class="bi bi-building text-xl text-orange-500"></i>
      </div>
      <div>
        <h3 class="text-lg font-bold text-slate-800">Perfil de la empresa</h3>
        <p class="text-xs text-slate-500">Revisa y actualiza los datos de tu empresa</p>
      </div>
    </div>
  </div>

  <form (ngSubmit)="onSubmit()" class="max-w-lg">
    <div class="space-y-5">
      <div>
        <label class="form-label">Nombre de la empresa</label>
        <input
          [(ngModel)]="name"
          name="name"
          type="text"
          required
          placeholder="Ej: Mi Empresa S.A. de C.V."
          class="form-input"
          [ngClass]="{ 'border-red-400': errors.name }">
        <p *ngIf="errors.name" class="form-error">{{ errors.name[0] }}</p>
      </div>

      <div>
        <label class="form-label">Código de empresa</label>
        <input
          [value]="company.code || '—'"
          type="text"
          readonly
          class="form-input bg-slate-50 text-slate-500 cursor-not-allowed">
        <p class="text-[10px] text-slate-400 mt-1">Código generado por el sistema. Tus empleados lo usarán para iniciar sesión en la app móvil.</p>
      </div>

      <div class="bg-slate-50 border border-slate-200 rounded-lg p-4">
        <label class="form-label text-slate-500">Logo</label>
        <div class="flex items-center gap-3">
          <div *ngIf="company.logo_path" class="w-12 h-12 rounded-lg bg-slate-200 overflow-hidden">
            <img [src]="company.logo_path" alt="Logo" class="w-full h-full object-cover">
          </div>
          <div *ngIf="!company.logo_path" class="w-12 h-12 rounded-lg bg-slate-200 flex items-center justify-center">
            <i class="bi bi-image text-slate-400"></i>
          </div>
          <span class="text-xs text-slate-400">Disponible próximamente</span>
        </div>
      </div>
    </div>

    <div class="mt-8 flex items-center gap-3">
      <button type="submit" [disabled]="isSubmitting" class="btn-primary">
        <i *ngIf="!isSubmitting" class="bi bi-arrow-right text-sm"></i>
        <svg *ngIf="isSubmitting" class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
        </svg>
        Guardar y continuar
      </button>
      <button
        type="button"
        (click)="onSkip()"
        class="text-xs font-medium text-slate-400 hover:text-slate-600 transition-colors">
        Omitir este paso (lo puedes hacer después)
      </button>
    </div>
  </form>
</div>
