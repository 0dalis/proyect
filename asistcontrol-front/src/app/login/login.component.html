<div class="min-h-screen bg-background-theme flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <h2 class="mt-6 text-center text-3xl font-extrabold text-text-title">
      Iniciar sesión
    </h2>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <!-- bg-surface en lugar de bg-white -->
    <div class="bg-surface py-8 px-4 shadow sm:rounded-lg sm:px-10">
      <div *ngIf="errorMessage" class="mb-4 p-2 text-sm text-red-600 bg-red-100 border border-red-400 rounded relative">
        {{ errorMessage }}
      </div>
      <form class="space-y-6" (ngSubmit)="onLogin()">
        <div>
          <label class="block text-sm font-medium text-text-body">
            Correo electrónico
          </label>
          <div class="mt-1">
            <input [(ngModel)]="email" name="email" type="email" required
              class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-border-focus-theme focus:border-border-focus-theme sm:text-sm">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-text-body">
            Contraseña
          </label>
          <div class="mt-1">
            <input [(ngModel)]="password" name="password" type="password" required
              class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-border-focus-theme focus:border-border-focus-theme sm:text-sm">
          </div>
        </div>

        <div>
          <!-- Botón usando tus colores de marca -->
          <button type="submit"
            class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary-medium hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-border-focus-theme transition duration-150 ease-in-out">
            Entrar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
