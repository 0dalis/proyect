<div class="min-h-screen bg-background-theme flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <h2 class="mt-6 text-center text-3xl font-extrabold text-text-title">
      Iniciar sesión
    </h2>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-surface py-8 px-4 shadow sm:rounded-lg sm:px-10">
      <form class="space-y-6" (ngSubmit)="onLogin()">
        <div>
          <label class="block text-sm font-medium text-text-body">
            Correo electrónico
          </label>
          <div class="mt-1">
            <input
            [(ngModel)]="email"
            name="email"
            type="email"
            required
            class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-border-focus-theme focus:border-border-focus-theme sm:text-sm">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-text-body">
            Contraseña
          </label>
          <div class="mt-1">
            <input
              [(ngModel)]="password"
              name="password"
              type="password"
              required
              class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-border-focus-theme focus:border-border-focus-theme sm:text-sm">
          </div>
        </div>

        <div>
          <!-- Botón usando tus colores de marca -->
        <button
          type="submit"
          [disabled]="!formValid || isLoading"
          class="w-full flex justify-center items-center gap-2 py-2 px-4 rounded-md shadow-sm text-sm font-medium text-white transition duration-150"

          [ngClass]="{
          'bg-primary-medium hover:bg-primary-dark cursor-pointer': formValid && !isLoading,
          'bg-gray-400 cursor-not-allowed': !formValid || isLoading
          }">
        <span *ngIf="!isLoading">
            Entrar
        </span>

        <svg *ngIf="isLoading"
            class="animate-spin h-5 w-5 text-white"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24">

            <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4">
            </circle>

            <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z">
            </path>

        </svg>

        </button>
        </div>
      </form>
    </div>
  </div>
</div>
