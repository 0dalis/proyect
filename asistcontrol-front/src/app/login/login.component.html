<div class="relative min-h-screen bg-background-theme flex flex-col justify-center py-12 sm:px-6 lg:px-8 overflow-hidden">

  <div class="absolute inset-0 pointer-events-none overflow-hidden z-0">
    <div class="absolute w-64 h-64 rounded-full bg-primary-medium/30 blur-xl animate-dvd-1"></div>
    <div class="absolute w-48 h-48 bg-primary-light/20 border border-primary-light/40 rounded-3xl blur-sm rotate-45 animate-dvd-2"></div>
    <div class="absolute w-56 h-56 bg-border-focus-theme/25 rounded-[40%_60%_70%_30%_/_40%_50%_60%_50%] blur-md animate-dvd-3"></div>
  </div>

  <div class="relative z-10 sm:mx-auto sm:w-full sm:max-w-md">
    <h2 class="mt-6 text-center text-3xl font-extrabold text-text-title tracking-tight">
      Iniciar sesión
    </h2>
  </div>

  <div class="relative z-10 mt-8 sm:mx-auto sm:w-full sm:max-w-md px-4 sm:px-0">
    <div class="bg-surface/40 backdrop-blur-xl border border-white/10 dark:border-gray-700/30 py-8 px-4 shadow-2xl rounded-2xl sm:px-10">

      <form class="space-y-6" (ngSubmit)="onLogin()">

        <div>
          <label class="block text-sm font-medium text-text-body mb-1">
            Correo electrónico
          </label>
          <div class="mt-1 relative rounded-md shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
              <i class="bi bi-envelope text-base"></i>
            </div>
            <input
              [(ngModel)]="email"
              name="email"
              type="email"
              required
              placeholder="tu@correo.com"
              class="appearance-none block w-full pl-10 pr-3 py-2 bg-surface/50 border border-gray-300 dark:border-gray-700 rounded-xl placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-border-focus-theme focus:border-border-focus-theme sm:text-sm transition-all duration-200">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-text-body mb-1">
            Contraseña
          </label>
          <div class="mt-1 relative rounded-md shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
              <i class="bi bi-lock text-base"></i>
            </div>
            <input
              [(ngModel)]="password"
              name="password"
              type="password"
              required
              placeholder="••••••••"
              class="appearance-none block w-full pl-10 pr-3 py-2 bg-surface/50 border border-gray-300 dark:border-gray-700 rounded-xl placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-border-focus-theme focus:border-border-focus-theme sm:text-sm transition-all duration-200">
          </div>
        </div>

        <div>
          <button
            type="submit"
            [disabled]="!formValid || isLoading"
            class="w-full flex justify-center items-center gap-2 py-2.5 px-4 rounded-xl shadow-md text-sm font-semibold text-white transition-all duration-200 active:scale-[0.98]"
            [ngClass]="{
              'bg-primary-medium hover:bg-primary-dark cursor-pointer shadow-primary-medium/20': formValid && !isLoading,
              'bg-gray-400 dark:bg-gray-700 cursor-not-allowed opacity-60': !formValid || isLoading
            }">

            <span *ngIf="!isLoading" class="flex items-center gap-x-2">
              <i class="bi bi-box-arrow-in-right text-base"></i>
              Entrar
            </span>

            <svg *ngIf="isLoading"
              class="animate-spin h-5 w-5 text-white"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
            </svg>
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
